name: Feature request
description: Suggest a feature or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Check the [roadmap](https://github.com/genesisdb-io/genesisdb/blob/main/ROADMAP.md) first, it lists what is planned and what is not. A short conversation here saves everyone time before any code is written.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The why, not the what. What were you trying to do when you wished this existed?
      placeholder: "When I rebuild a projection, I want to ... but ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you use it? A request body, a GDBQL example, a configuration variable, an SDK call.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, for example a projection, a precondition or a query that almost does it.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTTP API
        - GDBQL
        - Storage, indexes or durability
        - Backup, restore or migration
        - Security, tokens or TLS
        - Metrics or logging
        - MCP endpoint
        - Embedded Go API
        - SDKs or VS Code extension
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to contribute the implementation?
      options:
        - "Yes, with guidance"
        - "Yes, I can do it"
        - "No, just suggesting"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap and did not find this
          required: true
